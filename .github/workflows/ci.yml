name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt

      - name: Install
        run: python -m pip install -r src/requirements.txt -e ".[dev]" cfn-lint==1.46.0

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check the SAM template
        run: cfn-lint template.yaml

      - name: Test
        run: pytest
