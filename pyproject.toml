[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-summariser"
version = "0.2.0"
description = "Summarise Zoom meeting transcripts with an OpenAI model and e-mail the result from AWS Lambda."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tiktoken>=0.7",
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "tzdata",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.0",
    "boto3>=1.34",
    "moto>=5,<6",
]
gmail-setup = ["google-auth-oauthlib>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S603"]
"scripts/*" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["meeting_summariser"]
